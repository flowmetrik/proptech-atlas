positioning: The brokerage-scale platform that grew out of kvCORE — websites, CRM, recruiting and back office under one roof.
description: >
  BoldTrail is Inside Real Estate's platform, the successor branding to kvCORE. It is sold
  at brokerage and enterprise level and spans agent websites, a CRM with automated
  campaigns, listing marketing, recruiting and retention tooling, and — through BoldTrail
  BackOffice (the former Brokermint) — commission and transaction accounting.
real_estate_use: >
  A multi-office brokerage standardises its agents on one system: each agent gets a
  branded IDX site and CRM seat, the brokerage keeps ownership of the lead database, and
  leadership sees production, recruiting pipeline and commission splits in the same tool.
  It is chosen for the consolidation rather than for any single best-in-class module.
features:
  - Agent, team and brokerage IDX websites with lead capture
  - CRM with behavioural automation and mass texting
  - Listing marketing kits and social ad automation
  - Recruiting and retention module with agent production data
  - BackOffice for commission plans, disbursement and brokerage accounting
  - Marketplace of add-ons for ads, video and lead sources
use_cases:
  - persona: brokerage
    job: Give 500 agents a website and CRM without losing brokerage ownership of the data
  - persona: brokerage
    job: Track recruiting targets against real production numbers pulled from the MLS
