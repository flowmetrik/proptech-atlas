positioning: Business-intelligence platform that turns a social landlord's scattered systems into one decision-making dashboard.
description: >
  DÉCISIO Habitat is a French SaaS business-intelligence layer built for social
  housing landlords (bailleurs sociaux). It does not replace a landlord's ERP; it
  centralizes rental, property, financial and technical data pulled from existing
  systems and turns it into dashboards covering vacancy, rent arrears and recovery,
  tenant allocation, and property diagnostics.
real_estate_use: >
  A social-housing director tracks portfolio-wide vacancy and rent-arrears indicators
  without exporting spreadsheets from separate ERP, CRM and maintenance systems.
  Finance staff follow arrears ageing and recovery-action progress to prioritize
  collection, while property teams monitor allocation activity and diagnostic
  compliance across the stock. Because it plugs into a landlord's existing tools
  rather than replacing them, deployment runs in under three months.
features:
  - "Cross-system data centralization (ERP, GED, GMAO, CRM)"
  - Vacancy and rent-arrears dashboards
  - Tenant allocation and diagnostics reporting
  - Customizable indicators by objective
  - "Connectors for HLM-sector ERPs (Aareon, IKOS, Ulis, Salvia)"
use_cases:
  - persona: property-manager
    job: "Monitor rent arrears, ageing of debt and recovery actions across the housing stock from one dashboard"
  - persona: landlord-owner
    job: Track portfolio-wide vacancy and diagnostic compliance without manual exports from separate systems
