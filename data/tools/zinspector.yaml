positioning: "The most powerful inspection solution for property managers — AI-assisted, tenant self-service, fully connected."
description: >
  zInspector is property inspection software for property managers. It covers move-in,
  move-out and periodic unit inspections, with an AI feature (zAssistant) that builds
  a report from a spoken walkthrough, a tenant self-inspection option residents
  complete on their own phone, and an on-demand network of professional inspectors
  (OnSight PROS) for managers who want a report done for them.
real_estate_use: >
  A property manager doing a move-in inspection walks the unit narrating what they
  see, and zAssistant turns that into a report with photos, conditions and comments
  rather than the manager typing it up afterward. For a portfolio too large to walk
  every unit personally, the manager instead invites residents to complete a guided
  self-inspection with photos and a digital signature on their own phone, or books a
  professional inspector through OnSight PROS when an independent, legally defensible
  report is needed.
features:
  - AI-assisted inspection reports (zAssistant)
  - Tenant self-inspections
  - On-demand professional inspector network (OnSight PROS)
  - "Move-in, move-out and periodic inspections"
  - Digital signatures and photo documentation
use_cases:
  - persona: property-manager
    job: Turn a spoken unit walkthrough into a documented inspection report without manual write-up
  - persona: tenant-occupier
    job: Complete a guided move-in inspection with photos and a signature from a phone
