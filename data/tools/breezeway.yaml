positioning: "Property operations and guest experience platform for the teams cleaning, inspecting and servicing short-term rentals."
description: >
  Breezeway coordinates the field work behind a short-term rental portfolio rather
  than the booking side. It schedules cleaning and maintenance tasks, dispatches them
  to cleaners and vendors through a mobile app with photo checklists, tracks inventory
  and supplies, pays cleaners, and reports on what was done. A second product line
  handles guest communication: messaging, digital welcome books, an AI assistant
  answering guest questions, and paid upsells. A freemium tier covers a single
  property.
real_estate_use: >
  A vacation rental manager with a scattered portfolio and a mix of employed and
  subcontracted cleaners has the same problem every turnover day: knowing that each
  property was actually cleaned, inspected and restocked before the next guest
  arrives. Breezeway turns each departure into a scheduled task with a photo checklist
  the cleaner completes on their phone, so the manager sees evidence rather than a
  claim, and damage or a missing item surfaces as a work order before the guest does.
  Pricing is per property, which is why managers of five homes and of five hundred
  both use it, and residential and corporate housing operators use the same operations
  layer.
features:
  - Task scheduling and work coordination across field teams
  - "Mobile checklists with photo capture, available in several languages"
  - Work order and preventive maintenance management
  - Inventory and supply tracking
  - Cleaner and vendor payments
  - "Guest messaging with digital guidebooks, AI answering and paid upsells"
use_cases:
