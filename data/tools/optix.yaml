slug: optix
name: Optix
editor: ShareDesk Global
website: https://www.optixapp.com
hq_country: CA
markets: [US]
category: flex-coworking
founded: 2016
positioning: Automation-first coworking software built to let flex operators scale operations without adding headcount.
description: >
  Optix is a coworking and flex-space management platform (formerly ShareDesk)
  covering bookings, billing, invoicing, member communications and a white-label
  member app. Its distinguishing feature is a rules-based automation engine that
  triggers actions such as billing, notifications or access changes without manual
  admin work.
real_estate_use: >
  A coworking or flex-space operator uses Optix to run day-to-day operations — desk
  and room bookings, plan and pass sales, invoicing, visitor management — and to
  automate recurring admin tasks like billing reminders or check-in notifications
  through its automation module, so a small on-site team can run more locations
  without proportionally more staff.
features:
  - Desk and meeting room booking
  - Rules-based automation engine
  - "Billing, invoicing and plans/passes"
  - White-label member web portal and mobile app
  - Visitor management
  - API access and webhooks (Pro plan and above)
use_cases:
  - persona: property-manager
    job: Automate recurring billing and member notifications across one or more coworking locations
  - persona: investor-am
    job: "Standardize booking, billing and reporting for a multi-location flex portfolio"
