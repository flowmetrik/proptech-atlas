positioning: "Logiciel d'agence, site internet et web marketing chez le même éditeur, avec un marché inter-agences pour partager les mandats."
description: >
  Twimmo sells a French agency three things from one account: the transaction software
  that carries listings, contacts and documents from mandate to signed deed, the
  agency website that publishes them, and the marketing services around it —
  referencing, social publishing, campaigns. A separate inter-agency marketplace lets
  subscribing agencies share mandates with each other. The vendor is a French company
  and states that support and hosting are in France.
real_estate_use: >
  An independent agency of two or three negotiators does not have the time to
  integrate a CRM, a website builder and a syndication tool, and Twimmo is built for
  exactly that refusal: one subscription, one interface, and the website updates
  itself from the software rather than from a second data entry. The inter-agency
  market is the differentiating piece — a small agency with a mandate outside its area
  can offer it to the network rather than let it expire, which is the informal
  arrangement that independents already run by telephone. Larger structures with a
  dedicated marketing function will find the marketing layer redundant with what they
  already buy.
features:
  - "Gestion des mandats, biens et contacts"
  - Génération automatique des documents jusqu'à la signature
  - Site internet d'agence alimenté par le logiciel
  - Publication des annonces sur les réseaux sociaux
  - Référencement et web marketing
  - Market inter-agences pour partager les mandats
