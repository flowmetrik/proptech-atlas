positioning: Energy management that ends in a works order — engineering-led rather than reporting-led.
description: >
  Advizeo, part of the Setec engineering group, provides energy monitoring and management for
  French buildings: meter and building management system data collection, consumption
  analysis and alerting, décret tertiaire declaration support, and an action plan followed
  through to implementation.
real_estate_use: >
  Its difference from a pure reporting platform is the engineering behind it. Detecting that
  a building's heating runs at weekends is only useful if someone changes the schedule.
  Advizeo pairs the monitoring with technical recommendations and follow-up, which suits
  owners who do not have an in-house energy engineer.
features:
  - Meter, submeter and building management system data collection
  - Consumption analysis with drift and anomaly alerting
  - Décret tertiaire declaration and OPERAT support
  - Technical action plans with quantified savings
  - Works and measure follow-up over time
  - Multi-site portfolio dashboards
use_cases:
  - persona: facility-manager
    job: Detect and correct consumption drift instead of only reporting it
  - persona: corporate-re
    job: Meet décret tertiaire obligations with a costed action plan behind the declaration
