positioning: "MLS platform for MLS organisations, with market-configurable rules, IDX search for brokers and the Spark API for licensed data feeds."
description: >
  Flexmls is the multiple listing service platform published by FBS, an employee-owned
  American company that works only on MLS technology. An MLS organisation configures
  its own fields, rules and workflows in it, keeps control of how its data is
  protected, distributed and licensed, and gives subscribers listing entry, search and
  portal tools. Around the core sit an IDX product that puts MLS-sourced home search
  on a broker or agent website and routes incoming leads back into Flexmls portals and
  contact manager, the Spark API for developers consuming MLS data feeds, and a single
  sign-on Launch dashboard through which the MLS publishes the third-party
  applications its subscribers may use and tracks their return. The editor publishes
  an uptime commitment of 99.9 percent and does not publish prices.
real_estate_use: >
  The buyer here is the MLS organisation, not the individual agent: this is the system
  its subscribers log into to enter and search listings, and the place where the
  market's own rules are enforced at data entry rather than by staff afterwards. The
  editor cites one MLS that cut prohibited content in public remarks by 77 percent in
  three years using text constraints at the point of entry, which is the shape of the
  problem it is bought for. Brokers and agents meet it from the other side, through
  IDX search embedded on their own site with leads flowing back into the MLS contact
  manager, and developers through the Spark API when they need a licensed feed. The
  SSO dashboard is how an MLS decides which third-party tools reach its subscribers.
features:
  - "Fields, rules and workflows configurable per MLS market"
  - Text constraints enforcing listing content rules at data entry
  - "IDX home search embedded on broker and agent sites, with leads routed back"
  - Spark API for licensed MLS data feeds
  - Launch single sign-on dashboard for third-party applications
  - "MLS-held control over data ownership, distribution and licensing"
