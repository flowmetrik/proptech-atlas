hq_country: US
markets: [US]
category: diagnostics-compliance
positioning: "Report writing, scheduling, payments and client communication for home inspectors in one subscription."
description: >
  Spectora is a web and mobile platform for home inspectors. It combines the report
  writer with the surrounding business: online scheduling, inspection agreements with
  electronic signature, card payments, and the messages sent to buyers and agents.
  Reports are written on site from the mobile application or at a desk from the
  browser editor, with no cap on the number produced. The vendor also sells
  stand-alone inspector websites and a set of office tools for multi-inspector firms,
  and states it serves over 12,000 inspectors.
real_estate_use: >
  A home inspector finishes a walkthrough and has to deliver a photographed,
  structured report the same evening, while the buyer's agent is already asking for
  it. Spectora is where that report is written on site rather than retyped later, and
  where the booking, the signed agreement and the payment that preceded it also live.
  The reason a solo inspector buys it is that the alternative is three tools and a
  spreadsheet; the reason a multi-inspector firm buys it is that every inspector then
  produces the same document instead of a personal format. Templates are customisable,
  so an inspector who works a particular housing stock can carry their own wording
  from job to job.
features:
  - Mobile and browser report writing with unlimited reports
  - Online scheduling with automated client and agent messaging
  - Inspection agreements with electronic signature
  - "Card payments, with reports held until settlement"
  - Customisable report templates
  - Inspector websites and SEO sold alongside the software
use_cases:
