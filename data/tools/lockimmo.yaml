positioning: One French system for the three trades an agency can hold at once — transaction, gérance and syndic.
description: >
  LockImmo is a modular French real estate platform covering transaction, rental management
  and condominium management, with accounting, owner and co-owner portals, electronic
  signature and portal publishing, sold module by module.
real_estate_use: >
  A French agency frequently holds all three activities under one roof, and the accounting
  requirements differ for each: mandant accounting for gérance, separate accounts per
  copropriété for syndic. LockImmo covers the three in one system, which small and mid-sized
  agencies choose over running three specialised tools with no shared client record.
features:
  - Transaction module with mandates and matching
  - Rental management with mandant accounting and owner statements
  - Condominium module with per-building accounting and calls for funds
  - Owner, tenant and co-owner extranet portals
  - Electronic signature and document management
  - Portal publishing and agency website
