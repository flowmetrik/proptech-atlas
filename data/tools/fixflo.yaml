positioning: "Smart repairs and maintenance software that streamlines reporting, workflow and compliance for property managers."
description: >
  Fixflo is a repairs and maintenance management platform for residential and
  commercial property managers. Tenants and residents report issues through an online
  form, and the platform routes the report through a configurable workflow to
  contractors, tracking the job from first report to final invoice. It covers
  lettings, block management, commercial (CAFM), build to rent, and student
  accommodation, and ships with a contractor marketplace and an AI module (Aidenn) for
  triaging repair reports and reading fire risk assessments.
real_estate_use: >
  A letting agent or block manager receives a stream of repair reports from tenants
  and leaseholders and needs each one routed to the right contractor, tracked to
  completion, and logged for compliance — planned preventative maintenance in
  particular leaves no room for a missed inspection. Fixflo replaces the
  phone-and-spreadsheet routine with a workflow that timestamps every step from report
  to invoice, and its Aidenn AI module pre-triages incoming reports and can process
  fire risk assessment documents automatically.
features:
  - Reactive repair reporting via online form
  - Configurable maintenance workflow engine
  - Planned preventative maintenance scheduling
  - Contractor marketplace
  - Aidenn AI repair triage and compliance document reading
  - Customisable operational dashboards
use_cases:
  - persona: property-manager
    job: Route tenant-reported repairs to contractors and track each job to invoice
  - persona: facility-manager
    job: Schedule and log planned preventative maintenance for compliance
