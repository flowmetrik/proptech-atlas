positioning: A single-stack multifamily operating system — the accounting ledger and the leasing website are the same product, not an integration.
description: >
  Entrata is a multifamily-focused platform combining property accounting, leasing and
  marketing websites, resident portals, utility billing, insurance, revenue management and
  an AI leasing agent. Its architectural claim is one database behind every module rather
  than a suite assembled by acquisition.
real_estate_use: >
  Large apartment operators use it to run a lease-up and a stabilised asset on the same
  ledger. A prospect finds the community site, is answered by the AI leasing agent at
  midnight, tours, applies and signs — and the rent, concessions and renewal pricing all
  post to the same accounting without a nightly file transfer between systems.
features:
  - Property accounting and general ledger for multifamily
  - Marketing websites and ILS syndication per community
  - AI leasing agent handling prospect enquiries and tour scheduling
  - Resident portal with payments, renewals and service requests
  - Revenue management and pricing optimisation
  - Utility billing, insurance and ancillary revenue modules
use_cases:
  - persona: property-manager
    job: Operate a large apartment portfolio with leasing, pricing and accounting on one database
  - persona: investor-am
    job: Compare asset performance across a portfolio without reconciling systems
