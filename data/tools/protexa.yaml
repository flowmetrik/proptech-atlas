category: title-closing-legal
positioning: "Vos registres de l'immobilier dématérialisés, conformes à la loi Hoguet."
description: >
  Protexa is a cloud platform that digitizes the registers a French real estate agency
  is legally required to keep under the Hoguet law: the transaction mandate register,
  the anti-money-laundering (Tracfin) register, and the property management register,
  plus an optional directory register for escrow receipts. It also bundles a library
  of pre-filled contract templates produced with SOCAF and an electronic signature
  module.
real_estate_use: >
  An agency's compliance officer or manager reaches for Protexa the moment a new
  mandate is signed, reserving a mandate number remotely by phone or SMS instead of
  writing it into a paper register that must be produced intact at audit. The same
  account tracks Tracfin anti-money-laundering declarations and risk mapping, and
  gives a per-negotiator activity dashboard so an owner can check who holds which
  mandate without opening a filing cabinet.
features:
  - Digital transaction mandate register with remote number reservation by phone or SMS
  - Tracfin (AML) register with risk mapping and suspicious-activity declarations
  - Property management register for syndic and gérance activity
  - Directory register for escrow deposits and commission receipts
  - Pre-filled contract template library produced with SOCAF
  - Electronic signature for up to 20 signatories
use_cases:
  - persona: agent-broker
    job: Enregistrer un mandat de transaction et rester en conformité loi Hoguet sans registre papier
  - persona: legal-notary
    job: Suivre les déclarations Tracfin et la cartographie des risques de l'agence
