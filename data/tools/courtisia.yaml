positioning: "French software for regulated mortgage and business-credit brokers, published since 2013: file assembly, financing simulation, regulatory documents and automated invoicing."
description: >
  Courtisia, published by Fletesia, is a French web and mobile software for
  IOBSP-regulated credit intermediaries, covering mortgage credit, professional
  financing and wealth-management brokerage in one tool since 2013. It assembles loan
  files, runs financing simulations and borrowing-capacity calculations, generates
  regulatory documents with electronic signature, connects to lenders, and automates
  fee and commission invoicing with reporting.
real_estate_use: >
  A mortgage broker assembling a loan file needs to run an affordability simulation,
  produce the regulatory paperwork, get it signed, route it to the right lenders, and
  eventually invoice the fee and reconcile the bank's commission. Courtisia covers
  that sequence in one tool, with dashboards to track where every case stands and
  automated invoicing tied to case status — useful because French intermediary fees
  can only be billed once funds are released.
features:
  - Full loan file assembly
  - Financing simulation and borrowing-capacity calculation
  - Automatic generation of regulatory documents
  - Electronic signature of documents
  - Bank connectors for submitting files
  - Automated fee and commission invoicing
