positioning: "Flat-price booking and billing software for a single coworking space of up to fifty desks, with an interactive floor plan."
description: >
  DollyDesk is a French coworking management tool sold at one flat price rather than
  per member, for up to fifty bookable desks and meeting rooms. Members choose a seat
  on an interactive floor plan that shows photos of each space, then pay by card
  through Stripe or through PayFiP for publicly run spaces, or by recurring SEPA
  direct debit. It issues electronic invoices through an approved platform, exports to
  accounting, syncs bookings to Google, Outlook and Apple calendars over iCal, and
  opens Nuki or SmartAir smart locks as a paid option. Prepaid packs, for instance ten
  days, are supported alongside contracts. The product is operated and supported by a
  single person, who also handles migration from Nexudus, OfficeRnD or Cosoft.
real_estate_use: >
  A small coworking space or tiers-lieu reaches for DollyDesk when the manager's day
  is eaten by two questions, is there a seat free and where is my invoice. Members
  answer both themselves: they see the plan, book, pay, and get the invoice. Because
  PayFiP is supported next to Stripe, a space run by a local authority can take
  payments the way public accounting requires, which most competitors do not cover.
  The flat price and the fifty-desk ceiling say plainly who this is for: one site with
  a handful of rooms, not a network, and an operator who would rather pay a fixed line
  than a per-member one.
features:
  - Interactive floor plan with photos for choosing a desk or a room
  - "Flat single price up to fifty desks, not billed per member"
  - "Card payment through Stripe or PayFiP, plus recurring SEPA direct debit"
  - Automated electronic invoicing through an approved platform
  - "Prepaid booking packs, for example a ten-day pass"
  - "iCal sync to Google, Outlook and Apple calendars, with optional e-ink room displays"
