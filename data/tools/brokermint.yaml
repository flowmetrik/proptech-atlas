founded: 2014
positioning: Where a closed transaction becomes a commission calculation, an agent statement and an accounting entry.
description: >
  Brokermint — now sold as BoldTrail BackOffice — handles the brokerage side of a deal:
  commission plans, splits, caps, fees, agent billing, 1099 preparation and accounting
  export. Transaction management and e-signature sit alongside it so the same file feeds
  both compliance and money.
real_estate_use: >
  The problem it solves is that commission structures are individually negotiated. A
  brokerage encodes each agent's split, cap and fee schedule once, and every closing then
  produces a disbursement authorisation and an agent statement automatically. Year-end 1099
  preparation stops being a spreadsheet exercise.
features:
  - Commission plans with splits, caps, tiers and referral fees
  - Automatic disbursement authorisations and agent statements
  - Agent billing for monthly fees and chargebacks
  - Transaction management with document checklists and e-signature
  - QuickBooks export and accounting reconciliation
  - Production reporting by agent, office and team
use_cases:
  - persona: brokerage
    job: Calculate every agent's commission automatically from their negotiated plan
  - persona: brokerage
    job: Produce year-end 1099s and agent statements without rebuilding a spreadsheet
