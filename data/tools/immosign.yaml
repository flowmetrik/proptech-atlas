positioning: "Rédaction, signature et envoi des contrats immobiliers pour agences, constructeurs et promoteurs, jusqu'aux mentions manuscrites."
description: >
  ImmoSign, published by MyLegitech, digitises the contract chain of a French real
  estate professional. Documents are assembled from generic or bespoke templates
  written by the vendor's legal team, signed electronically, sent by registered
  electronic mail, and recorded in electronic mandate registers. It handles the
  handwritten mentions that French law attaches to certain contracts, offers a
  signature tablet for signing in person, and exposes an API. It addresses agencies,
  home builders and developers rather than agencies alone.
real_estate_use: >
  The step that usually breaks a remote signature in France is the handwritten
  mention: a clause the signer must copy out by hand for the contract to hold. A
  generic e-signature tool does not produce it, so the file goes back to paper for one
  paragraph. ImmoSign covers that step, which is why builders and developers — whose
  CCMI and VEFA reservation contracts carry the heaviest mention requirements — appear
  alongside agencies on the product. The signature tablet exists for the same reason
  in reverse: some signatures still happen at the desk, and the office wants one
  archive rather than a scanner and a drive.
features:
  - Rédaction assistée à partir de trames juridiques
  - Signature électronique des actes et contrats
  - Mentions manuscrites électroniques
  - Registres électroniques des mandats
  - Recommandé électronique
  - Tablette de signature et API
use_cases:
  - persona: agent-broker
    job: Faire signer un mandat à distance avec ses mentions manuscrites
  - persona: developer-builder
    job: Digitaliser un contrat de réservation VEFA ou un CCMI
