positioning: "Financing software for French IOBSP credit brokers, covering the calculation, document and invoicing side of a mortgage file."
description: >
  Actelo is a French SaaS platform for IOBSP credit brokers. It covers the financing
  side of a mortgage file end to end: eligibility and amortisation calculations,
  borrower insurance quoting, generation of the regulatory financing documents, a
  document management space, a borrower portal, invoicing of the parties involved and
  activity statistics. It is sold per user with a published monthly price and no
  commitment.
real_estate_use: >
  A mortgage broker takes in a buyer whose offer has just been accepted and has to
  turn a project into a bankable file within days. Actelo runs the calculation side:
  it works out which loan structures the project is eligible for, prices the borrower
  insurance, lists the supporting documents to collect, and produces the financing
  proposal and the regulatory paperwork. The borrower drops the documents in their own
  space instead of emailing them, and the broker follows the file stage by stage until
  the invoicing of the commission. Independent brokers and franchise networks use it
  as their whole back office rather than as an add-on to a CRM.
features:
  - Automated financing calculations and loan structuring
  - Borrower insurance pricing and one-click quote
  - Configurable financing documents and electronic signature
  - Document management and borrower self-service portal
  - Stage-by-stage file tracking
  - "Invoicing of brokers, mandataires and partners, with activity statistics"
use_cases:
  - persona: lender-broker
    job: Produce a financing proposal and its supporting file for a buyer whose offer has been accepted
  - persona: brokerage
    job: Run a network of mandataires on one workspace with per-user billing and shared reporting
