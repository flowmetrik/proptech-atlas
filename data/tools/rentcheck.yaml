positioning: "Tenant-guided property inspections: the resident completes the inspection from their phone, the manager gets the report."
description: >
  RentCheck is an inspection application for residential property managers built
  around inspections carried out by the tenant rather than by staff. The manager sends
  a guided inspection; the resident completes it step by step on their phone with
  time-stamped photos, and a report is produced without a site visit. It ships with
  templates for move-in, move-out and routine inspections, automated reminders and
  scheduling, comparison against previous inspections, work order tracking, an API and
  integrations with the main property management systems. Pricing is published per
  unit per month.
real_estate_use: >
  A property management company adding doors hits a wall on inspections: scheduling
  visits, chasing tenants for access and driving between properties does not scale, so
  routine inspections quietly get skipped for the tenants presumed to be fine.
  RentCheck inverts the model — the tenant does the walkthrough on their phone with a
  guided checklist and timestamped photos — so the team handles only the exceptions.
  The photographic record with dates is also what settles a security deposit dispute
  at move-out, since move-in and move-out inspections can be compared side by side.
features:
  - Tenant-guided inspections with time-stamped in-app photo capture
  - "Templates for move-in, move-out, routine and pre-move-out inspections"
  - Automated inspection reminders and scheduling
  - Comparison against previous inspections
  - "360-degree photo and video capture, and asset capture"
  - "Work order tracking, PMS integration and a public API"
use_cases:
  - persona: property-manager
    job: Complete routine inspections across a growing portfolio without sending anyone on site
  - persona: landlord-owner
    job: Hold a dated photographic record of condition at move-in to settle the deposit at move-out
