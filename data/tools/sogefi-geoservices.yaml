positioning: "Fifteen French geolocation APIs — zoning, permits, cadastre, transactions — for the software editors who build on top of them."
description: >
  Sogefi GéoServices is an API platform publishing structured French property and land
  data: urban planning zoning documents (API URBA), building and demolition permits
  (API ADS), cadastral parcels, condominium registries, transaction prices and
  natural-hazard zoning. It sells to software editors, local authorities and
  private-sector integrators rather than to end consumers.
real_estate_use: >
  A proptech editor adding a parcel-lookup or a permit-tracking feature does not want
  to become a data-pipeline company: it calls Sogefi's API URBA or API ADS and gets
  the current zoning or permit history for a given parcel, kept current by Sogefi
  instead of scraped and maintained in-house. A local authority builds its own
  planning portal on the same infrastructure without operating GIS servers of its own.
features:
  - Urban planning zoning and PLU documents by parcel (API URBA)
  - "Building, demolition and development permit records (API ADS)"
  - Cadastral parcel and condominium registry data
  - Property transaction prices (DVF+)
  - Natural and technological hazard zoning (API RISQUES)
  - Vector map tiles covering French territory
use_cases:
  - persona: developer-builder
    job: Check zoning constraints and permit history on a parcel before committing to a project
  - persona: corporate-re
    job: Feed parcel-level planning and hazard data into an internal tool without building GIS infrastructure
