category: construction-development
positioning: Site observations pinned to the plan, captured on a tablet and turned into a report before leaving the site.
description: >
  BulldozAIR is a French field collaboration application for construction: annotate plans,
  create positioned observations with photos, assign them to a company with a deadline,
  track their resolution, and generate site reports and reserve lists automatically.
real_estate_use: >
  A site visit produces dozens of observations that traditionally become an evening of report
  writing and a week of chasing. Pinning each one to a plan coordinate, assigning it on the
  spot and generating the report before leaving compresses that cycle to the visit itself —
  and gives each contractor an unambiguous location rather than a paragraph of description.
features:
  - Plan annotation with positioned observations
  - Photo capture attached to each observation
  - Assignment to companies with deadlines and status
  - Automatic site report and reserve list generation
  - Offline capture with synchronisation
  - Delivery and handover inspection workflows
use_cases:
  - persona: developer-builder
    job: Produce a site visit report with positioned reserves before leaving the site
  - persona: facility-manager
    job: Run a delivery inspection with unambiguous locations for each reserve
