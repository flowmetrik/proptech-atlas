founded: 2008
positioning: The French price map the public consults — and the seller-lead engine agencies buy on the strength of it.
description: >
  MeilleursAgents publishes street-level price estimates across France from notarial and
  market data, offers owners a free online valuation, and sells agencies visibility and
  seller leads generated by those valuation requests, alongside agency comparison and review
  features.
real_estate_use: >
  It changed the French listing appointment. An owner arrives having already read a
  neighbourhood price per square metre, so the agent's pricing conversation starts from a
  public reference rather than from a blank page. On the professional side, an owner who
  requested a valuation is a seller lead with intent, which is what agencies actually pay for.
features:
  - Street and neighbourhood level price indices
  - Free online valuation for owners
  - Seller lead generation and delivery to agencies
  - Agency visibility, profiles and reviews
  - Market trend indicators by city and district
  - Agency performance comparison for consumers
use_cases:
  - persona: agent-broker
    job: Buy seller leads from owners who have just requested a valuation
  - persona: landlord-owner
    job: Get a reference price for a property before meeting an agency
