positioning: "Pet policy management and assistance animal accommodation review for rental housing, HOAs and vacation rentals."
description: >
  PetScreening collects a pet or animal profile from every applicant and resident,
  including households declaring no pet, and centralises it alongside the tenancy
  file. Its distinct piece is the assistance animal review: an in-house team examines
  each reasonable accommodation request against HUD and Fair Housing Act guidance and
  returns a documented recommendation to both the requester and the manager. The
  vendor also publishes a tool for benchmarking pet-related revenue. It covers
  long-term, mid-term, vacation, manufactured and student housing.
real_estate_use: >
  An on-site leasing team is asked to grant an assistance animal accommodation and
  cannot legally ask most of the questions that would let them judge it — the wrong
  question is itself a discrimination exposure. PetScreening moves that review off the
  on-site team to a reviewer working to HUD and FHAct guidance, and returns a written
  recommendation that documents the decision. The everyday effect is more mundane: pet
  photos, vaccination records and policy acknowledgements stop being chased by email
  and arrive with the application, which is where the reported time saving per
  application comes from.
features:
  - "Pet and animal profile collected from every applicant, including no-pet declarations"
  - Assistance animal accommodation review against HUD and FHAct guidance
  - Documented recommendation shared with requester and manager
  - "Centralised vaccination records, photos and policy acknowledgements"
  - Pet revenue benchmarking tool
  - Integrations with residential property management systems
use_cases:
  - persona: property-manager
    job: Handle an assistance animal accommodation request without exposing the on-site team to a discrimination claim
  - persona: syndic-manager
    job: Apply one documented pet policy across an HOA's residents
