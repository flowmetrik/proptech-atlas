positioning: Template-based video and AI photo editing so a French real estate agent can produce listing marketing content without a videographer.
description: >
  Danim is a French SaaS platform that turns a listing's photos into marketing video
  using templates, and edits the photos themselves with AI tools (virtual staging,
  object removal, wall or floor renovation, weather correction). It also schedules and
  publishes the resulting content to social media with automatically generated
  captions.
real_estate_use: >
  An independent agent or mandataire drops a listing's photos into Danim, picks one of
  the ready-made templates, and gets a branded video ready to post within minutes
  instead of booking a videographer. The same agent uses the AI photo tools to stage
  an empty room or fix a dated wall before the video is made, then schedules the post
  to social media from the same platform.
features:
  - Template-based real estate video generation
  - AI virtual staging and object removal
  - AI wall and floor renovation preview
  - Multi-format social media publishing with AI captions
  - Publication calendar
  - Brand-compliant templates for agency networks
use_cases:
  - persona: agent-broker
    job: Turn listing photos into a branded marketing video without hiring a videographer
  - persona: brokerage
    job: Keep every agent's listing videos on-brand across a network
