positioning: Software for French property development operations — the bilan promoteur, the VEFA sales ledger and the cost control in one system.
description: >
  Salvia Software publishes solutions for French property developers and social housing
  operators covering development operation management: feasibility and operation budget,
  cost and commitment tracking, VEFA reservation and sale follow-up, calls for funds by
  construction stage, and operation profitability reporting.
real_estate_use: >
  A French development operation has a financial structure no generic tool models: the bilan
  promoteur, VEFA sales where the buyer pays by construction milestone, and a margin that
  moves with every signed contract and every works order. Salvia is bought to hold that
  structure — the operation budget and the sales ledger reconciled against one another.
features:
  - Operation feasibility and bilan promoteur modelling
  - Cost, commitment and works contract tracking
  - VEFA reservation and sale follow-up
  - Calls for funds by construction milestone
  - Operation and portfolio profitability reporting
  - Social housing operation specifics
