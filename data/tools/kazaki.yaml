positioning: "L'intelligence immobilière : décrivez votre projet, l'IA traduit ça en critères de recherche et vous recommande les biens qui vous correspondent."
description: >
  Kazaki is a French property-search portal for individuals, founded by Kazaki SAS
  (Reims). Rather than a filter-based search engine, it offers conversational
  search: the buyer describes their project in natural language, and the AI scans
  partner agencies' listings to recommend properties, enriched with a price
  estimate, a mortgage simulator and the DPE energy rating. iOS and Android mobile
  apps.
description_fr: >
  Kazaki est un portail français de recherche immobilière pour particuliers, fondé par
  Kazaki SAS (Reims). Plutôt qu'un moteur à filtres, il propose une recherche
  conversationnelle : l'acheteur décrit son projet en langage naturel, et l'IA
  parcourt les annonces des agences partenaires pour recommander des biens, enrichis
  d'une estimation de prix, d'un simulateur de crédit et du DPE. Applications mobiles
  iOS et Android.
real_estate_use: >
  An agency (L'Atelier Immo, ERA, Les Clefs Immo and Redouté are cited as partners)
  has its listings picked up and enriched on Kazaki, which exposes them to buyers
  already qualified through their conversation with the AI rather than through
  classic filters — an additional lead-acquisition channel, on the same principle
  as a mainstream portal.
features:
  - Recherche conversationnelle par IA plutôt que par filtres
  - Agrégation des annonces d'agences partenaires
  - Estimation de prix et simulateur de crédit intégrés
  - Affichage du diagnostic de performance énergétique par bien
  - Applications mobiles iOS et Android
use_cases:
  - persona: agent-broker
    job: Faire recommander ses annonces à des acheteurs qualifiés par une recherche conversationnelle
  - persona: brokerage
    job: Gagner un canal d'acquisition de leads acheteurs complémentaire aux portails classiques
