positioning: A French agency package sold module by module, so a small agency buys only the trade it practises.
description: >
  Immofacile provides French real estate professionals with transaction software, rental
  management and syndic modules, portal publishing, agency websites and document management,
  packaged so an agency subscribes only to the activities it holds.
real_estate_use: >
  Small French agencies rarely practise all three regulated activities, and paying for a full
  administration suite to run transaction alone is a common source of overspend. Modular
  pricing is the practical argument here, with the option to add gérance later without
  migrating the client and property records.
features:
  - Modular transaction, rental and syndic activities
  - Mandate management and buyer matching
  - Portal publishing and agency website
  - Owner and tenant document management
  - Electronic signature integration
  - Accounting for the modules subscribed
