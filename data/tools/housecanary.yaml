positioning: Valuation sold with its confidence interval, for people who have to act on the number.
description: >
  HouseCanary provides residential automated valuations, forecast values, rental estimates and
  condition-adjusted appraisals, delivered by API and through analyst-facing products. Its
  output is designed for institutional use — every value comes with an accuracy band.
real_estate_use: >
  An iBuyer or a single-family rental fund cannot send an appraiser to every candidate house.
  It prices thousands of addresses a week through an AVM, and the confidence interval decides
  which ones get a human inspection. Lenders use the same feeds for portfolio monitoring and
  collateral review between full appraisals.
features:
  - Residential AVM with confidence scoring
  - Three-year value and rent forecasts by block and metro
  - Rental value estimation
  - Condition-adjusted valuation products
  - Market analytics down to block group
  - Delivery by API and bulk file
use_cases:
  - persona: investor-am
    job: Price thousands of candidate homes a week and flag the ones needing a human look
  - persona: lender-broker
    job: Monitor collateral value across a loan portfolio between full appraisals
