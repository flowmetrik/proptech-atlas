positioning: The broadest multifamily suite in the market — and the one whose revenue management product put algorithmic rent pricing under legal scrutiny.
description: >
  RealPage sells a wide portfolio for multifamily and single-family rental operators:
  property management systems (OneSite, Propertyware, Buildium), leasing and marketing,
  screening, utility management, asset optimisation and the AI Revenue Management products
  descended from YieldStar and LRO.
real_estate_use: >
  Large operators use it for the modules they cannot easily build: screening at scale,
  utility recovery, and above all revenue management — a model that recommends a rent for
  every unit every day based on market and portfolio signals. That last product is the
  subject of US antitrust litigation over algorithmic pricing, which is now part of any
  serious evaluation of it.
features:
  - OneSite property management and accounting
  - AI Revenue Management rent pricing recommendations
  - Applicant screening and fraud detection
  - Utility billing and expense recovery
  - Leasing, marketing and contact centre services
  - Asset and portfolio performance analytics
