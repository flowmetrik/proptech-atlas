positioning: One of the reference transaction systems for French agencies — mandate, matching, portal publishing and website in a single subscription.
description: >
  Hektor is La Boîte Immo's real estate software for French agencies and networks: property
  and contact records, mandate management, automated buyer matching, portal publishing,
  electronic signature, and an agency website generated from the same catalogue.
real_estate_use: >
  A French agency's daily cycle runs on the mandate. Hektor holds the signed mandate and its
  legal mentions, matches each new listing against registered buyer criteria and sends the
  alert, publishes to the portals the agency subscribes to, and feeds the agency site. The
  reason it is bought as a suite is that in France the website and the portal feed are the
  same catalogue.
features:
  - Property and mandate management with French legal mentions
  - Buyer criteria matching with automatic alerts
  - Multi-portal publishing from one catalogue
  - Agency website generated from the same listings
  - Electronic signature on mandates and offers
  - Pige and prospecting modules
use_cases:
  - persona: agent-broker
    job: Match a new mandate against registered buyers and alert them the same day
  - persona: brokerage
    job: Run listings, portal feeds and the agency website from one catalogue
