positioning: A vacation rental website and booking engine first, with channel management attached.
description: >
  Lodgify provides vacation rental owners and small managers with a website builder and
  direct booking engine, channel manager synchronising with major platforms, reservation and
  calendar management, payment processing and automated guest messaging.
real_estate_use: >
  For an owner with two or three holiday properties, the practical question is whether to pay
  fifteen percent commission forever. Lodgify's proposition is a bookable site they own,
  with the channels kept as a fill mechanism — a different emphasis from the professional
  systems, which assume channels are the primary demand source.
features:
  - Website builder with direct booking engine
  - Channel manager across major booking platforms
  - Calendar, rate and reservation management
  - Payment processing and damage deposits
  - Automated guest messaging and templates
  - Owner and property performance reporting
use_cases:
  - persona: landlord-owner
    job: Take direct bookings on an owned site instead of paying commission on every stay
  - persona: property-manager
