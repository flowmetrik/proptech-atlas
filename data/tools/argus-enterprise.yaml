hq_country: CA
markets: [US, FR]
category: investment-underwriting
also_in: [commercial-am]
founded: 1985
positioning: The cash-flow model the industry agreed to standardise on — a valuation is credible partly because it is an ARGUS file.
description: >
  ARGUS Enterprise models commercial property cash flows lease by lease: rent steps,
  recoveries, renewal probabilities, capital expenditure and debt, producing valuations,
  hold-sell analysis and portfolio consolidation. Its file format is a de facto industry
  exchange standard.
real_estate_use: >
  When an asset trades, the seller's broker sends an ARGUS file and the buyer re-underwrites
  in the same tool. That shared format is most of the value — assumptions are visible and
  comparable rather than buried in someone's private spreadsheet. Appraisers, lenders and
  fund managers use it for the same reason.
features:
  - Lease-by-lease commercial cash flow modelling
  - Recovery structures, rent steps and market leasing assumptions
  - Valuation by discounted cash flow and direct capitalisation
  - Debt, equity waterfall and hold-sell analysis
  - Portfolio consolidation and scenario comparison
  - Industry-standard file exchange with counterparties
use_cases:
  - persona: investor-am
    job: Underwrite an acquisition from the seller's own cash flow model
  - persona: appraiser
    job: Produce a valuation in the format lenders and auditors expect
