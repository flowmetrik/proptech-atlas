category: lending-mortgage
founded: 1997
positioning: The loan origination system a large share of US mortgages are actually manufactured in.
description: >
  Encompass is a loan origination system covering the mortgage lifecycle: application intake,
  processing, underwriting, closing document generation, compliance testing and delivery to
  investors, with a configuration and partner ecosystem around it.
real_estate_use: >
  A residential mortgage is a regulated manufacturing process — disclosure timing, fee
  tolerance, appraisal ordering, TRID compliance — where a missed deadline is a legal defect,
  not an inconvenience. Encompass encodes those rules in the workflow, which is why it sits
  at the centre of most lender operations and why the whole vendor ecosystem integrates with
  it.
features:
  - End-to-end loan origination workflow from application to funding
  - Automated compliance testing including TRID and disclosure timing
  - Closing document generation and e-signature
  - Product and pricing engine integration
  - Investor delivery and secondary market handoff
  - Extensive partner integration marketplace
use_cases:
  - persona: lender-broker
    job: Manufacture a compliant residential loan file from application to funding
  - persona: lender-broker
    job: Deliver closed loans to investors without re-keying the file
