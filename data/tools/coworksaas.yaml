positioning: "Coworking management software built around its own access control, so a space can stay open around the clock and bill by the hour."
description: >
  CoworkSaaS is a French platform for coworking operators that couples subscription
  and hourly-access management with an access-control system of its own: QR-code
  readers, turnstiles and door-locking kits rented monthly alongside the software.
  Members sign up from the operator's own website, receive a personal QR code, and are
  billed either on a recurring plan or on the time actually spent on site, computed
  from entry and exit scans. Additional services are billed through the same engine:
  meeting rooms, printing, lockers, business domiciliation, a connected fridge. A
  pooled remote video-surveillance service is offered for unstaffed hours. Two plans
  are published, per space per month.
description_fr: >
  CoworkSaaS est une plateforme française pour les opérateurs de coworking qui associe la gestion
  des abonnements et des accès à l'heure à son propre système de contrôle d'accès : lecteurs QR
  code, tourniquets et kits de verrouillage de porte loués au mois en complément du logiciel. Les
  membres s'inscrivent depuis le site de l'opérateur, reçoivent un QR code personnel, et sont
  facturés soit sur un forfait récurrent, soit sur le temps réellement passé sur place, calculé à
  partir des scans d'entrée et de sortie. Les services additionnels sont facturés via le même
  moteur : salles de réunion, impression, casiers, domiciliation d'entreprise, réfrigérateur
  connecté. Un service mutualisé de vidéosurveillance à distance est proposé pour les heures sans
  personnel. Deux forfaits sont publiés, par espace et par mois.
real_estate_use: >
  The problem this addresses is opening hours. An operator who wants to sell access
  outside staffed hours has to know who is in the building and to bill them with
  nobody at the desk; CoworkSaaS answers both with one QR code, since the scan that
  opens the turnstile also starts the meter. Hourly billing is the part most
  competitors do not cover, and it is what lets a space sell to occasional users who
  would never take a monthly plan. Sign-up and the client area are embedded in the
  operator's own website, so a prospect never leaves the brand, and a live counter of
  free seats can be published to members.
features:
  - Hourly access billed from entry and exit QR-code scans
  - "Proprietary access control: QR readers, turnstiles and door-locking kits"
  - Recurring subscription billing with automatic payment
  - Sign-up and client-area modules embedded in the operator's own website
  - "Additional services engine: meeting rooms, printing, lockers, domiciliation"
  - Pooled remote video surveillance for unstaffed hours
