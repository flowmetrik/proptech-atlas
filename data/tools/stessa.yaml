positioning: Accounting written for the rental investor rather than for the accountant — free, and organised by property.
description: >
  Stessa tracks rental property income and expenses through linked bank accounts,
  categorises transactions to a real estate chart of accounts, stores documents, and
  produces owner-level dashboards and tax-ready reports. The core product is free.
real_estate_use: >
  The individual investor's real problem is Schedule E: proving, a year later, which
  transaction belonged to which property. Stessa auto-categorises bank activity by property,
  keeps receipts attached, and produces the tax package. It is bookkeeping shaped by how a
  landlord actually thinks — per door, not per account.
features:
  - Automatic transaction import and categorisation by property
  - Property-level income, expense and cash flow dashboards
  - Document storage attached to properties and transactions
  - Tax-ready reports including Schedule E preparation
  - Rent collection and tenant screening options
  - Portfolio valuation tracking
use_cases:
  - persona: investor-am
    job: Produce a tax-ready Schedule E package per property without a bookkeeper
  - persona: landlord-owner
    job: See real cash flow per door rather than one blended bank balance
