category: syndic-copro
positioning: Le logiciel de syndic et gérance qui redonne du temps aux équipes.
description: >
  Bellman est un logiciel de gestion pour cabinets de syndic et de gérance, né d'une
  ex-startup de syndic en ligne reconvertie en éditeur de logiciel en 2022. Il
  centralise le travail des gestionnaires, comptables et assistants autour d'une
  messagerie intégrée, d'un extranet pour les copropriétaires et le conseil syndical,
  et d'outils d'automatisation documentaire pour les assemblées générales.
real_estate_use: >
  Un cabinet de syndic reçoit chaque jour des dizaines de factures et de demandes par
  email : Bellman les rattache automatiquement aux bons dossiers et permet de traiter
  les devis et les documents de copropriété directement depuis la messagerie, sans
  ressaisie. Le gestionnaire prépare l'ordre du jour d'une assemblée générale tout au
  long de l'année plutôt qu'en urgence, suit les envois de convocations en temps réel
  et enregistre les votes par correspondance. Le conseil syndical et les
  copropriétaires suivent l'avancement de leurs dossiers et le recouvrement des
  charges depuis un extranet dédié, ce qui réduit les appels et emails de suivi au
  cabinet.
features:
  - Extranet copropriétaires et conseil syndical
  - Intégration messagerie pour le traitement des factures et devis
  - Préparation et suivi des assemblées générales
  - Vote par correspondance (VPC)
  - "Automatisation documentaire (procès-verbaux, états datés)"
use_cases:
  - persona: syndic-manager
    job: Traiter les factures et devis reçus par email sans ressaisie dans le dossier de copropriété
  - persona: syndic-manager
    job: Préparer et suivre l'envoi des convocations et le vote par correspondance d'une assemblée générale
