positioning: "Estimation immobilière gratuite pour particuliers, financée par la mise en relation avec des professionnels partenaires."
description: >
  Immo IA est un service gratuit d'estimation immobilière pour particuliers :
  l'utilisateur décrit un bien et obtient une valeur estimée avec une fourchette,
  calculée à partir des transactions DVF de la DGFiP et d'une vingtaine d'autres
  sources publiques, sur les 34 856 communes de France métropolitaine. Le service se
  finance en mettant en relation, avec l'accord explicite de l'utilisateur, les
  particuliers avec des professionnels partenaires — agences immobilières,
  diagnostiqueurs, courtiers en crédit, notaires — qui paient pour recevoir ces
  contacts qualifiés.
real_estate_use: >
  Une agence immobilière, un diagnostiqueur ou un courtier en crédit cherche des
  contacts qualifiés de particuliers en projet de vente, d'achat ou de financement,
  sans acheter un flux générique. Le professionnel devient partenaire Immo IA et
  reçoit les demandes de particuliers ayant déjà obtenu une estimation et accepté
  explicitement d'être mis en relation — un lead pré-qualifié par l'usage du service,
  pas une adresse achetée à l'aveugle.
features:
  - Estimation automatisée à partir des données DVF et d'une vingtaine de sources publiques
  - Carte des prix au m² par commune
  - "Calculateurs frais de notaire, capacité d'emprunt, plus-value, rendement locatif"
  - Annuaire de professionnels vérifiés par métier
  - Mise en relation payante avec accord explicite du particulier
use_cases:
  - persona: agent-broker
    job: Recevoir des contacts de particuliers ayant déjà obtenu une estimation de leur bien
  - persona: lender-broker
    job: Recevoir des demandes de financement qualifiées issues de la plateforme particuliers
