positioning: "Full-web software for French estate agencies, pairing property and client management with an AI assistant built into the daily workflow."
description: >
  Pilotim is a French web-based estate agency software covering property and contact
  management, matching of buyers against listings, communication material, templated
  emails and activity history. It embeds an AI assistant, marketed as IA Pilotim,
  which drafts or rewrites listing copy from the property's attributes, turns an
  agent's notes into a visit report for the owner, writes SEO articles for the agency
  blog, restyles or virtually furnishes interior photos and returns before-and-after
  images, answers questions asked in plain language over the agency's own listings,
  estimates, contacts and statistics, and creates a property from dictation on mobile.
  The publisher also sells agency websites, paid and organic search work and training;
  software plans are priced publicly per month.
real_estate_use: >
  An independent French agency runs its day inside Pilotim: entering a mandate,
  matching it against the buyer base, publishing it, and keeping the record of what
  was said and when. The AI is aimed squarely at the two tasks agents postpone,
  writing the listing text and writing the visit report back to the owner, and the
  voice capture on mobile exists so a property can be created during the visit rather
  than back at the desk. The assistant also reads the vendor's own documentation and
  can open the right form or run the action it just described, which is how a new
  negotiator gets productive without a training session. Agencies that buy the website
  and search work from the same publisher get lead capture wired into the same base.
features:
  - Property and contact management with buyer-to-listing matching
  - AI drafting of listing copy from the property's attributes
  - AI visit reports written from the agent's notes for the owner
  - "Virtual restyling and furnishing of interior photos, delivered as before and after"
  - "Natural-language querying of the agency's listings, estimates, contacts and statistics"
  - Voice creation of a property from the mobile application
use_cases:
  - persona: agent-broker
    job: Create a property by voice during the visit and get the listing text and the owner's report written back
  - persona: brokerage
    job: "Run listings, buyer matching and the agency website from a single publisher"
