positioning: "A free, collaborative tool from Cerema to help French local authorities find buildable land without further urban sprawl."
description: >
  UrbanSIMUL is a web application published by Cerema, the French public technical
  agency for ecological transition and territorial cohesion, that visualizes and
  simulates land occupation at the parcel scale so local authorities can identify
  vacant or under-used buildable land as part of "sobriété foncière" (land-use
  restraint) policy. Access is free after registration.
real_estate_use: >
  A planning officer at a municipality or intercommunality opens UrbanSIMUL to screen
  a commune for parcels that could absorb new housing without converting more farmland
  or forest, then exports a shortlist to brief an elected official or a developer
  being approached for a project. The observatoire mode lets several public actors
  share the same parcel inventory and canvassing notes over time instead of each
  rebuilding it from scratch.
features:
  - Parcel-level land occupation visualization and characterization
  - Buildable land potential assessment
  - Vacant and under-used parcel prospecting
  - Urbanization scenario modeling
  - Shared land and housing observatories
  - Tabular and cartographic data export
use_cases:
  - persona: developer-builder
    job: Screen a commune for buildable parcels before approaching an owner or a local authority
  - persona: corporate-re
    job: Assess land potential on a site ahead of an acquisition or a public consultation
