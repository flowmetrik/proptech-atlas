positioning: "Produit les documents réglementaires d'urbanisme et de risques attachés à une vente — ERP, ENSA, note d'urbanisme, droits de préemption — à partir d'une base tenue à jour."
description: >
  Preventimmo, part of the Septeo group, maintains a continuously updated database of
  French planning and environmental-risk data and turns it into the regulatory
  documents a property sale requires. Its catalogue covers the état des risques et
  pollutions, the état des nuisances sonores aériennes, the état des risques et
  pollutions des sols, a clay-shrinkage risk summary, notes de renseignements
  d'urbanisme, pre-emption rights, certificates and cadastral concordance. The same
  data is delivered three ways: the customer produces documents themselves online,
  delegates production to Preventimmo's own team, or connects directly to the
  underlying regulatory database for their own use. The vendor states sixteen years of
  activity, 106 staff and 5,000 active customers.
real_estate_use: >
  A notary preparing a deed, or an agent taking a mandate, has to attach an état des
  risques that is both current and defensible — and the underlying planning and risk
  data changes at the commune level without notice. Rather than querying prefecture
  and municipal sources by hand, they generate the ERP and the urban planning note
  from Preventimmo in a few clicks and attach them to the file. A diagnostics firm
  doing this at volume delegates the production entirely, or plugs its own software
  into the regulatory database so the documents appear inside the tool its technicians
  already use. When a sale is later contested on a disclosure point, the documents
  carry a traceable source and date.
features:
  - État des risques et pollutions (ERP) généré en ligne
  - État des nuisances sonores aériennes (ENSA) et état des risques des sols (ERPS)
  - Notes de renseignements d'urbanisme et droits de préemption
  - Synthèse risques argiles et concordance cadastrale
  - Production déléguée des documents par les équipes de l'éditeur
  - Accès direct à la base réglementaire pour intégration dans un logiciel tiers
use_cases:
  - persona: legal-notary
    job: "Attacher à un acte des documents d'urbanisme et de risques conformes et datés, sans interroger chaque source publique"
  - persona: agent-broker
    job: Produire l'ERP d'un bien au moment de la prise de mandat pour tenir l'obligation d'information de l'acquéreur
  - persona: appraiser
    job: Alimenter son propre logiciel de diagnostic depuis la base réglementaire plutôt que de ressaisir les données
