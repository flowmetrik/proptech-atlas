positioning: "La technologie au service de l'immobilier : quatre outils pour signer, afficher, filmer et prospecter."
description: >
  Clap.tech est un éditeur français qui propose une suite de quatre modules vendus
  séparément pour les agences immobilières : clap.legal (édition et signature
  électronique de documents juridiques), clap.show (vitrines connectées pour les
  agences), clap.video (habillage vidéo automatique des annonces) et clap.expert
  (intelligence de marché pour cibler des mandats). Revendique plus de 6 000
  professionnels de l'immobilier clients.
real_estate_use: >
  Une agence équipe ses vitrines de rue avec clap.show pour afficher ses annonces sans
  mise à jour manuelle, transforme ses annonces en vidéos courtes pour les réseaux
  sociaux avec clap.video, fait signer électroniquement mandats et compromis avec
  clap.legal, et utilise clap.expert pour repérer les biens à fort potentiel de mandat
  sur son secteur.
features:
  - Génération et signature électronique de documents juridiques
  - Vitrines connectées pilotées à distance
  - Habillage vidéo automatique d'annonces immobilières
  - Intelligence de marché pour cibler des mandats
use_cases:
  - persona: agent-broker
    job: Afficher ses annonces sur une vitrine connectée sans repasser par l'agence
  - persona: brokerage
    job: Faire signer un mandat ou un compromis à distance
