positioning: An all-in-one property management system for independent hospitality — the small hotel, the gîte, the chambre d'hôtes.
description: >
  Amenitiz combines a property management system, a website builder with a direct booking
  engine, a channel manager, payment processing and revenue tools, aimed at independent
  accommodation providers rather than at professional rental managers.
real_estate_use: >
  The independent French hospitality operator — a guesthouse, a small hotel, a set of gîtes —
  typically has no website of its own and depends entirely on commissioned platforms.
  Amenitiz packages the site, the booking engine and the channel connections in one
  subscription, which is why it reaches operators who would never buy three separate tools.
features:
  - Property management system for small accommodation
  - Website builder with direct booking engine
  - Channel manager across major booking platforms
  - Payment processing and deposit handling
  - Rate and availability management
  - Guest communication and review handling
