hq_country: FR
markets: [FR]
category: flex-coworking
positioning: "All-in-one management platform for coworking spaces, tiers-lieux and fablabs, covering booking, billing, door access and community."
description: >
  Cosoft is a French SaaS platform for running shared workspaces, published by FTEL.
  It handles desk and meeting-room booking on an interactive calendar, online payment,
  automatic quotes and invoices with an accounting export, a member community layer,
  and connections to door-access, wifi and printing systems. It is sold as a free
  tier, a Premium plan at a published monthly price and a quoted Pro plan that adds
  multi-site management, a prospecting CRM and API access. The editor counts forty
  connected partners, fifteen of them online payment providers and seventeen
  access-control systems.
real_estate_use: >
  A coworking or tiers-lieu manager uses Cosoft as the operating system of the site:
  members book a desk or a meeting room themselves and pay online, the invoice and the
  accounting export follow without re-keying, and the door opens on a badge or from a
  phone. Local authorities running a tiers-lieu reach for it for the same reasons plus
  the occupancy figures they have to report. The community side, directory and posts
  and chat and paid or free events, is what a manager uses to keep the place alive
  once the operational part runs itself. Multi-site and the API sit in the top plan,
  which is where a small network of spaces lands rather than a single site.
features:
  - "Interactive booking calendar for desks, private offices and meeting rooms"
  - Automatic quote and invoice generation with ready-made accounting export
  - Online payment through fifteen connected payment providers
  - Door access managed through seventeen connected access-control systems
  - "Member community layer: directory, posts, chat, email campaigns, events"
  - Prospecting CRM and API access on the top plan
use_cases:
