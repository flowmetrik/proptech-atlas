positioning: A receivables platform that consolidates every way a resident or owner pays rent into one automated ledger.
description: >
  ClickPay is a payment processing and receivables platform for property and HOA
  managers. It combines online and mobile payment portals, lockbox and check scanning,
  walk-in cash payment locations, e-billing, and accounting-system integration to
  consolidate electronic payments, checks and money orders into a single reconciled
  feed.
real_estate_use: >
  A property or association manager stops manually keying in checks and money orders
  by routing every payment channel (online portal, mailed check, walk-in cash)
  through ClickPay, which reconciles them against the accounting system automatically.
  A resident who prefers to pay in person uses one of the walk-in cash network
  locations instead of mailing a check.
features:
  - "Online and mobile payment portal (ACH, credit, debit)"
  - Lockbox and check scanning
  - Walk-in cash payment network
  - E-billing and print bill delivery
  - Accounting software integration
  - Transaction and bank deposit reporting
use_cases:
  - persona: property-manager
    job: "Consolidate checks, cash and online payments into one reconciled feed"
  - persona: syndic-manager
    job: Collect HOA dues through a single payment platform instead of chasing checks
