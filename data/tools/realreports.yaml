also_in: [ai-assistants]
positioning: The AI-powered property report for real estate agents.
description: >
  RealReports est une plateforme de renseignement immobilier qui compile des données
  provenant d'une quinzaine de sources pour produire, à la demande, des rapports sur
  un bien : zones inondables, historique, analyse de divulgations. Aiden, la couche
  d'intelligence du produit, répond aux questions sur un bien et alimente RealCMA, un
  outil d'analyse comparative de marché. Le produit se distribue en partie via des
  accords avec des MLS américaines, qui en ouvrent l'accès à leurs agents membres.
real_estate_use: >
  Un agent préparant une offre veut savoir rapidement si un bien est en zone
  inondable, ce que révèlent les documents de divulgation du vendeur, et comment le
  positionner face au marché local : il génère un RealReport et interroge Aiden en
  langage naturel plutôt que de croiser lui-même plusieurs bases de données. Pour
  construire une analyse comparative de marché à présenter à un client, l'agent
  utilise RealCMA, qui produit un document au format de présentation habituel de
  l'agence en quelques secondes plutôt qu'en heures de recherche manuelle.
features:
  - Rapport de renseignement sur un bien (RealReports)
  - Assistant IA sur les données du bien (Aiden)
  - Analyse comparative de marché (RealCMA)
  - Vérification de zone inondable et analyse de divulgations
  - Compilation de données issues de multiples fournisseurs
use_cases:
  - persona: agent-broker
    job: Vérifier le risque d'inondation et l'historique d'un bien avant de préparer une offre
  - persona: agent-broker
    job: Construire une analyse comparative de marché personnalisée pour un client en quelques secondes
