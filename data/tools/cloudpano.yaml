category: visuals-tours
founded: 2018
positioning: 360° virtual tour software built for entrepreneurs and agents who want to keep their own brand on the tour.
description: >
  CloudPano is a browser-based editor for building and hosting 360° virtual tours from
  photos, spins or 360° video, with white-label publishing so the tour carries the
  operator's own brand rather than the software's.
real_estate_use: >
  A real estate agent, broker or a photographer serving them uploads 360° photos of a
  listing, arranges them into a walkable tour with hotspots, and embeds the finished
  tour on the listing page or MLS entry under their own brand rather than CloudPano's
  — used mainly to make a listing shareable and embeddable without a dedicated VR
  headset workflow.
features:
  - "360° photo, spin and video scene types"
  - Hotspot and embedded media editor
  - White-label / private-label publishing
  - Website and WordPress embedding
  - VR headset viewing mode
  - Multi-region hosting
