hq_country: US
markets: [US]
category: lending-mortgage
positioning: "The modern, web-based, end-to-end loan origination system for residential mortgage lending."
description: >
  LendingPad is a cloud-based loan origination system (LOS) used by mortgage lenders,
  brokers, banks and credit unions to run the residential mortgage process end to end,
  from application through closing, on a single centralized platform.
real_estate_use: >
  A loan officer or operations team uses LendingPad to capture and manage borrower
  details — identity, employment, assets, liabilities, owned properties — in one
  shared record, send requests such as title, verification of employment and hazard
  insurance directly from the platform, and balance the closing disclosure and fees
  before closing.
features:
  - Centralized borrower record shared across the team
  - "Title, VOE and hazard insurance requests sent from the platform"
  - Closing disclosure balancing and fee calculation
  - "Web-based access, no local install"
  - "Workflow built for lenders, brokers, banks and credit unions"
use_cases:
  - persona: lender-broker
    job: Originate and process a residential mortgage loan from application to closing on one shared system
  - persona: lender-broker
    job: "Send and track third-party requests (title, VOE, hazard insurance) without leaving the loan file"
