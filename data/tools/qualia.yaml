positioning: Title and escrow production software where the lender, the agent and the buyer work inside the same closing file.
description: >
  Qualia is a title, escrow and closing platform: order management and title production,
  escrow accounting and reconciliation, document generation, a secure portal for all parties,
  remote online notarisation and digital closings, plus a marketplace of title services.
real_estate_use: >
  A US closing coordinates a title agent, a lender, two brokerages and a buyer, historically
  through email and fax. Qualia gives them one file: the buyer uploads identity documents and
  wiring instructions through a secure portal — which is also the main defence against wire
  fraud, the industry's most expensive failure — and escrow accounting reconciles inside the
  same system.
features:
  - Title order management and production workflow
  - Escrow accounting with three-way reconciliation
  - Secure multi-party closing portal with document exchange
  - Wire fraud protection and verified wiring instructions
  - Remote online notarisation and digital closing
  - Marketplace for title search and settlement services
use_cases:
  - persona: legal-notary
    job: Run title production and escrow accounting in one auditable system
  - persona: agent-broker
    job: Track a closing file and its outstanding conditions without email chains
