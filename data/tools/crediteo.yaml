positioning: "Cloud software for French credit intermediaries: build a mortgage file and its simulations, follow the lenders, invoice the fee."
description: >
  Créditéo is a French publisher of web applications for regulated credit
  intermediaries, real estate agents and notaries. Its platform centralises prospect
  and client files, runs configurable financing simulations, and tracks the lenders
  and parties attached to each case in a single dashboard. It issues fee invoices,
  bank commission invoices and off-case invoices in line with the French billing rules
  that took effect in January 2018, and reports production by branch, broker, partner,
  stage and period. Rights management and configurable case stages let a network
  reproduce its own process. The editor states more than 20,000 users.
real_estate_use: >
  A broker's day is a queue of half-complete files, each waiting on a document or a
  lender's answer. Créditéo is the desk where that queue is ordered: configurable
  stages say where each case stands, task lists and notifications say who owes what,
  and the simulator turns an affordability question into a fully-formed loan
  application in a single sitting. Its invoicing module matters more than it sounds —
  French intermediary fees can only be billed once the funds are released, so a broker
  needs the tool to know the difference between a fee earned and a commission owed by
  the bank. Web calculators and pre-filling contact forms embed on the broker's own
  site, so an enquiry arrives as a started file instead of an e-mail.
features:
  - Centralised prospect and client files with configurable case stages and task lists
  - Financing simulator that assembles the loan application from the simulation
  - Lender and party dashboard per case
  - "Fee, bank commission and off-case invoicing with payment tracking"
  - "Production statistics by branch, broker, partner, stage and period"
  - Embeddable web calculators and pre-filling contact forms for the broker's site
use_cases:
  - persona: lender-broker
    job: "Assemble a complete mortgage application and its simulations in one sitting, then follow it to release of funds"
  - persona: brokerage
    job: Invoice fees and bank commissions from the case file and reconcile what has actually been paid
