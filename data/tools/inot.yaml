positioning: The notarial software published from inside the profession's own technical body.
description: >
  iNot is a suite for French notarial offices published by ADNOV, the technology subsidiary
  of the notariat's own infrastructure group: deed and file production, office management,
  accounting, and connection to the profession's shared services and registers.
real_estate_use: >
  Its distinguishing characteristic is proximity to the profession's central infrastructure —
  the registers, the secure exchange network and the electronic authentic deed. For an office,
  that means the chain from drafting to registration stays within one technical ecosystem
  rather than crossing vendor boundaries at each step.
features:
  - Notarial deed and file production
  - Office and client management
  - Notarial accounting and client funds handling
  - Connection to the profession's shared registers and services
  - Electronic authentic deed workflows
  - Secure inter-office exchange
