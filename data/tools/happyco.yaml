positioning: "Maintenance and asset-condition platform for multifamily operators, built around mobile inspections, work orders and unit turns."
description: >
  HappyCo is an operations platform for multifamily owners and property managers
  organized into several suites: maintenance operations (preventive maintenance, work
  orders, make-readies, inspections and reporting), an after-hours answering and
  triage service that turns resident calls into work orders, asset management covering
  capital budgets, renovation projects, vendor compliance and inventory, asset
  evaluation for due diligence and lease-file audits, and a sourcing module for vendor
  bidding. Its mobile apps work offline and sync when connectivity returns, and it
  integrates with the main property management systems as a certified partner. A
  separate lending suite connects to Freddie Mac's Optigo network for origination
  inspections.
real_estate_use: >
  A regional manager responsible for several thousand apartments cannot personally see
  the condition of any of them. Their onsite technicians run every inspection —
  move-in, move-out, life safety, make-ready — inside the HappyCo mobile app, which
  timestamps photos and pushes the result back with no paper. When a unit is vacated,
  the make-ready workflow assigns the punch list and the manager watches the turn
  close in a dashboard rather than by phone. At acquisition, the same apps are used
  for due-diligence walks and lease-file audits so the buyer's condition assessment
  sits in the system the operator will use afterwards. Overnight resident calls are
  triaged by the answering service and arrive the next morning as work orders already
  routed.
features:
  - Mobile inspections with timestamped photos and offline sync
  - "Work orders, preventive maintenance schedules and make-ready turn tracking"
  - After-hours call triage that generates work orders automatically
  - "Capital budget, renovation project and vendor compliance tracking"
  - Due-diligence and lease-file audit workflows for acquisitions
  - "Benchmarking dashboards across properties, units and staff"
use_cases:
  - persona: property-manager
    job: "Run move-in, move-out and life-safety inspections on mobile and close a unit turn against a tracked punch list"
  - persona: facility-manager
    job: Schedule preventive maintenance and dispatch work orders to onsite technicians across a portfolio
  - persona: investor-am
    job: Carry out due-diligence walks and lease-file audits on an acquisition inside the platform the operator will keep using
