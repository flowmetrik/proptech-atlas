positioning: Software, website and distribution from one French vendor, with a long history in portal feed management.
description: >
  Poliris supplies French agencies with transaction software, agency websites and listing
  distribution to portals, historically as one of the main feed operators in the French
  market. Its own domain no longer resolves and its former address redirects to Orisha Real
  Estate, where the Poliris name does not appear: whether the product still ships under this
  brand is unresolved.
real_estate_use: >
  Its practical value to an agency is the same as Ubiflow's — one catalogue, many
  destinations — with the software and the site included rather than integrated. Agencies
  that do not want to assemble a stack from three vendors buy the whole chain here and
  accept the trade-off of less choice at each layer.
features:
  - Multi-portal listing distribution
  - Transaction software with listings and contacts
  - Agency website generation
  - Lead consolidation across channels
  - Media and format handling per portal
  - Reporting on publication and lead volume
