positioning: Software and website sold as one product, with the agency site treated as a lead-generation asset rather than a brochure.
description: >
  Netty provides French agencies with transaction software — listings, contacts, mandates,
  matching, portal publishing — combined with a website builder, SEO tooling, electronic
  signature and rental management modules.
real_estate_use: >
  Independent French agencies compete with national networks whose brand carries the online
  traffic. Netty's positioning answers that: the agency site is built for local search
  visibility, and every enquiry it produces lands in the same system as the mandate and the
  portal leads, so an independent can measure whether its own site is out-earning its portal
  subscriptions.
features:
  - Transaction management with mandates and matching
  - Agency website with SEO structures and lead capture
  - Multi-portal publishing and feed management
  - Rental management and lease modules
  - Electronic signature integration
  - Prospecting and pige tooling
