positioning: "Gérer sa copropriété soi-même, avec un accompagnement professionnel en option."
description: >
  Coprolib' is an online platform and mobile app for syndics bénévoles — condo owners
  who manage their building themselves instead of hiring a professional syndic. It
  automates the accounting required to stay compliant, gives residents a shared,
  real-time view of the building's finances and documents, and covers general assembly
  preparation and execution. Optional paid support from Coprolib's own property
  management experts is available for accounting, administrative tasks or major
  decisions.
real_estate_use: >
  A volunteer syndic uses Coprolib' to keep the building's books compliant without
  hiring an accountant: fund calls, expense allocation and financial statements are
  automated, and every co-owner can log in and see the same numbers instead of waiting
  for a paper report. When the volunteer needs help preparing a general assembly or
  handling an unusual expense, they can add on Coprolib's professional support instead
  of switching to a full syndic.
features:
  - Automated compliance accounting for condo associations
  - "Shared, real-time view of finances and documents for co-owners"
  - General assembly preparation and execution tools
  - Budget and fund-call tracking
  - "Optional professional support add-on (accounting, admin, guidance)"
use_cases:
  - persona: syndic-manager
    job: Tenir la comptabilité d'une copropriété sans faire appel à un syndic professionnel
  - persona: landlord-owner
    job: Suivre en temps réel les finances et les décisions de sa copropriété
