slug: opinion-system
name: Opinion System
editor: Opinion System
website: https://www.opinionsystem.fr
hq_country: FR
markets: [FR]
category: agent-marketing
positioning: "Le tiers de confiance qui certifie la réputation des professionnels, avec une méthode d'avis contrôlés triple certifiée AFNOR."
description: >
  Opinion System est un institut de sondage français qui collecte et contrôle des avis
  clients pour plusieurs professions réglementées, dont l'immobilier. Sa méthode de
  collecte est certifiée AFNOR (ISO 9001, ISO 20252, NF Service 522, NF ISO 20488) :
  les avis sont vérifiés avant publication par un processus audité chaque année.
real_estate_use: >
  Une agence immobilière ou un courtier en crédit s'inscrit auprès d'Opinion System
  pour faire certifier ses avis clients : la plateforme sollicite les clients après
  une transaction, contrôle l'authenticité des avis avant publication, et l'agence
  affiche le badge de réputation certifiée sur son site pour rassurer de nouveaux
  prospects.
features:
  - Collecte d'avis clients certifiée AFNOR
  - Contrôle des avis avant publication
  - Page réputation dédiée par professionnel
  - Déclinaison sectorielle pour l'immobilier et le courtage en crédit
