# Le registre des terrains de chasse.
#
# Le chercheur ne « cherche pas sur le web » en général : il balaie une source
# nommée à la fois. C'est ce qui rend la couverture auditable — on sait ce qui a
# été regardé, quand, et ce que ça a rapporté — et ce qui empêche la boucle de
# repasser éternellement sur les mêmes trois annuaires.
#
# `last_swept` et `yield` sont écrits par scripts/enrich/sweep.mjs. Ne pas les
# remplir à la main : ce sont des mesures, pas des intentions.
#
# Ajouter une source : donner son `id`, son `url`, son marché, sa nature, et une
# ligne disant CE QU'ON Y TROUVE que les autres n'ont pas. Une source qui ne
# répond pas à cette dernière question n'en est pas une.

meta:
  # Une source non balayée depuis ce nombre de jours redevient prioritaire.
  cooldown_days: 21
  # Nombre de sources balayées par passe de la routine.
  per_run: 4

kinds:
  marketplace: >
    Annuaire d'intégrations d'un éditeur établi. Le meilleur rendement du lot :
    un incumbent y liste des dizaines d'outils de niche que personne d'autre ne
    référence, et le fait que l'intégration existe prouve que le produit tourne.
  association: >
    Annuaire de partenaires d'un syndicat professionnel. Rendement moyen mais
    signal fort : un éditeur listé là est en usage réel chez des adhérents.
  event: >
    Liste d'exposants d'un salon. C'est là qu'on trouve les acteurs récents qui
    n'ont pas encore de référencement, particulièrement en France.
  press: >
    Presse spécialisée. Rendement irrégulier, mais c'est la seule source qui
    signale un produit AVANT qu'il ait un annuaire.
  vc: >
    Portefeuille d'un fonds spécialisé. Détecte tôt, mais attention : une levée
    n'est pas un produit en usage. Vérifier deux fois.
  review: >
    Plateforme d'avis. Ses pages catégories sont un bon index, même si le site
    lui-même renvoie 403 à un accès automatisé.
  launch: >
    Plateforme de lancement. Beaucoup de bruit, quelques trouvailles précoces.
  opensource: >
    Dépôts et listes open source. Faible volume, mais ces produits sont
    invisibles ailleurs et cochent une case que personne d'autre ne coche.
  public: >
    Données ou marchés publics. Révèle les éditeurs du logement social et des
    collectivités, absents de tous les annuaires commerciaux.

